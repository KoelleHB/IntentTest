name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6 Wrapper
        run: |
          # 1. Projektverzeichnis finden
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Fehler: Keine settings.gradle gefunden!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projektverzeichnis: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          # 2. Wrapper sauber isoliert in /tmp generieren, damit kein Projekt geladen wird
          if [ ! -f "./gradlew" ]; then
            echo "Erstelle Gradle 8.6 Wrapper..."
            mkdir -p /tmp/gradle-setup
            cd /tmp/gradle-setup
            curl -sSL "https://services.gradle.org/distributions/gradle-8.6-bin.zip" -o gradle.zip
            unzip -q gradle.zip
            mkdir wrapper-gen && cd wrapper-gen
            ../gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --no-daemon
            
            # Kopiere die fertigen Wrapper-Dateien ins Projekt
            cp gradlew "$GITHUB_WORKSPACE/$PROJECT_DIR/"
            cp -r gradle "$GITHUB_WORKSPACE/$PROJECT_DIR/"
            rm -rf /tmp/gradle-setup
          fi

          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
