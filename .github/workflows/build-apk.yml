name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Android Project & Ensure Gradle Wrapper
        run: |
          # 1. Finde heraus, wo settings.gradle(.kts) liegt
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Fehler: Keine settings.gradle gefunden!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Gefundenes Projektverzeichnis: $PROJECT_DIR"
          
          # 2. Prüfen, ob gradlew vorhanden ist - falls nicht, generieren
          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            echo "gradlew fehlt. Installiere Gradle und erzeuge Wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
