name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Locate Project & Setup Gradle Wrapper
        run: |
          # 1. Projektverzeichnis finden
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Fehler: Keine settings.gradle gefunden!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projektverzeichnis gefunden: $PROJECT_DIR"

          # 2. Sauberen Gradle 8.4 Wrapper bereitstellen (kompatibel mit AGP 8.x)
          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            echo "gradlew fehlt. Installiere Gradle 8.4..."
            curl -sSL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle.zip
            unzip -q gradle.zip
            # Wrapper ohne Ausführung des Projekt-Builds generieren:
            ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4 -p . --no-daemon
            rm -rf gradle-8.4 gradle.zip
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
